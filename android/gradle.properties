# AGP 8.5 still defaults android.useAndroidX to false (it only flips in AGP 9.0),
# and every dependency here is AndroidX. Without this the build fails outright.
android.useAndroidX=true

# Jetifier rewrites legacy support-library artifacts. Nothing in this project uses
# them, and leaving it on both slows the build and can rewrite classes into
# genuine duplicates. Explicitly off.
android.enableJetifier=false

# CI runners are memory-constrained; the default 512 MB heap OOMs during dexing.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# NOTE: android.disableDuplicateClassesCheck is deliberately NOT set here.
# That check is the only thing standing between a resolution bug and a
# ClassNotFoundError at runtime on a user's device. If it fires, the dependency
# graph is wrong and must be fixed — see the constraints block in build.gradle.kts.
