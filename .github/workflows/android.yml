name: Candela CI

# Option B from ANDROID_NATIVE_PLAN.md section 1.3: the dev sandbox cannot reach
# dl.google.com / Maven Central / services.gradle.org, so the Android toolchain
# lives here in CI. The pure-Kotlin protocol and vision layers are verified on
# every push; the APK job activates when the Android modules land (Stage 3+).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1: the TypeScript reference still typechecks and the golden vectors are
  # reproducible. If regenerating the vectors changes a single byte, the protocol
  # has drifted and the Kotlin port below is no longer trustworthy.
  # ---------------------------------------------------------------------------
  golden-vectors:
    name: Golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck the frozen TypeScript reference
        run: npx tsc --noEmit

      - name: Regenerate golden vectors
        run: npx tsx tools/gen-golden.ts

      - name: Fail if vectors are not byte-reproducible
        run: |
          if ! git diff --quiet -- android/core-protocol/src/test/resources/golden; then
            echo "::error::Golden vectors changed. Either the TS protocol drifted or"
            echo "::error::generation is non-deterministic. Both are release blockers."
            git diff --stat -- android/core-protocol/src/test/resources/golden
            exit 1
          fi
          echo "Golden vectors are byte-reproducible."

      - name: Assert /src is untouched by the Android work
        run: |
          if ! git diff --quiet HEAD -- src; then
            echo "::error::/src is the frozen protocol reference and must not be modified."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Gate 2: Kotlin protocol is byte-identical to TypeScript, and the vision gates
  # behave per the audit. Needs only a JDK.
  # ---------------------------------------------------------------------------
  kotlin-verify:
    name: Protocol parity + vision gates
    runs-on: ubuntu-latest
    needs: golden-vectors
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify protocol + vision
        working-directory: android
        run: gradle --no-daemon verify

      # Stage 4/6 pure decision logic (exposure strategy, AF/AE lock policy, YUV
      # ROI math, hold-time pacing). Compiled with kotlinc so it runs without the
      # Android SDK — identical to ./android/verify-local.sh.
      - name: Set up Kotlin compiler
        run: |
          npm pack kotlin-compiler --silent >/dev/null
          mkdir -p "$HOME/kotlinc" && tar xzf kotlin-compiler-*.tgz -C "$HOME/kotlinc"
          chmod +x "$HOME/kotlinc/package/bin/"*
          echo "$HOME/kotlinc/package/bin" >> "$GITHUB_PATH"

      - name: Verify Stage 4 + Stage 6 logic
        run: |
          kotlinc \
            android/optical-camera/src/pure/kotlin/app/candela/camera/*.kt \
            android/optical-render/src/pure/kotlin/app/candela/render/*.kt \
            android/optical-camera/src/pure/test/kotlin/app/candela/camera/*.kt \
            android/optical-render/src/pure/test/kotlin/app/candela/render/*.kt \
            -include-runtime -d stage46.jar
          java -cp stage46.jar app.candela.camera.CameraLogicTestsKt

      # Stage 7: the thermal governor ladder. The ratchet invariant (no lever
      # permits more work at a hotter level) is checked across every ordered pair
      # of levels, which is the property a plausible one-branch edit breaks.
      - name: Verify Stage 7 thermal governor
        run: java -cp stage46.jar app.candela.render.ThermalTestsKt

      # Stage 8: the blocking SAS gate and the SHA-256 export gate. These are the
      # security-relevant invariants ("no DATA frame is ingested before BOTH
      # parties confirm", "no partial file is ever written"), so they gate the
      # build rather than merely reporting.
      - name: Verify Stage 8 SAS + export gates
        run: |
          kotlinc \
            android/core-protocol/src/main/kotlin/app/candela/protocol/*.kt \
            android/core-protocol/src/test/kotlin/app/candela/protocol/*.kt \
            -include-runtime -d stage8.jar
          java -cp stage8.jar app.candela.protocol.Stage8TestsKt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate 3: the APK. Skipped until the Android modules are uncommented in
  # settings.gradle.kts (Stage 3 of the plan), so CI stays green in the meantime
  # instead of failing red on work that has not started.
  # ---------------------------------------------------------------------------
  apk:
    name: Build Android modules / APK
    runs-on: ubuntu-latest
    needs: kotlin-verify
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the app module exists yet
        id: probe
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android app module not present yet (Stage 3 pending). Skipping APK build."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Stage 4/6 Android layers compile even before the app module exists.
      - name: Assemble library modules
        if: steps.probe.outputs.ready == 'false'
        working-directory: android
        run: gradle --no-daemon :optical-camera:assembleDebug :optical-render:assembleDebug

      - name: Assemble debug APK
        if: steps.probe.outputs.ready == 'true'
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        if: steps.probe.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candela-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
